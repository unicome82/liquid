<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <!-- Home-screen app: full screen with a see-through status bar so the liquid reaches the top edge -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="LIQUID" />
    <link id="touch-icon" rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link id="favicon" rel="icon" type="image/png" href="/apple-touch-icon.png" />
    <!-- Temporary icon trial: ?icon=b swaps in the alternate home-screen icon -->
    <script>
      if (new URLSearchParams(location.search).get('icon') === 'b') {
        for (const id of ['touch-icon', 'favicon']) document.getElementById(id).href = 'apple-touch-icon-b.png';
      }
    </script>
    <title>LIQUID</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500&family=Syne:wght@600;800&family=Meie+Script&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=block" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
